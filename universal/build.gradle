plugins {
    id 'base'
}

def commonJar = project(':common').tasks.named('jar')
// Loom omits remapJar when the game already uses the official namespace.
def fabricJarName = project(':fabric').tasks.findByName('remapJar') != null ? 'remapJar' : 'jar'
def fabricJar = project(':fabric').tasks.named(fabricJarName)
def neoForgeJar = project(':neoforge').tasks.named('jar')

tasks.register('universalJar', Jar) {
    group = 'build'
    description = 'Builds a universal Fabric + NeoForge mod jar from one common code base.'

    dependsOn commonJar
    dependsOn fabricJar
    dependsOn neoForgeJar

    archiveBaseName.set(rootProject.mod_id)
    archiveVersion.set("mc${rootProject.range_minecraft_version}-${rootProject.version}")
    archiveClassifier.set('')

    destinationDirectory.set(
            rootProject.layout.buildDirectory.dir('libs')
    )

    // A duplicate entry means common classes or resources were packaged twice.
    duplicatesStrategy = DuplicatesStrategy.FAIL

    // 1. Common code and resources, packaged exactly once.
    from({
        zipTree(commonJar.get().archiveFile.get().asFile)
    }) {
        exclude 'META-INF/MANIFEST.MF'
        exclude 'META-INF/*.SF'
        exclude 'META-INF/*.RSA'
        exclude 'META-INF/*.DSA'
        exclude 'pack.mcmeta'
        exclude 'fabric.mod.json'
        exclude 'META-INF/neoforge.mods.toml'
    }

    // 2. Fabric adapter classes and Fabric metadata only.
    from({
        zipTree(fabricJar.get().archiveFile.get().asFile)
    }) {
        include 'grasspow/universal_click/fabric/**'
        include 'fabric.mod.json'
    }

    // 3. NeoForge adapter classes and NeoForge metadata only.
    from({
        zipTree(neoForgeJar.get().archiveFile.get().asFile)
    }) {
        include 'grasspow/universal_click/neoforge/**'
        include 'META-INF/neoforge.mods.toml'
    }

    manifest {
        attributes(
                'Implementation-Title': rootProject.mod_id,
                'Implementation-Version': rootProject.version,
                'Built-On-Minecraft': rootProject.minecraft_version,
                'Fabric-Mapping-Namespace': 'official'
        )
    }
}

tasks.register('verifyUniversalJar') {
    group = 'verification'
    description = 'Verifies the contents of the merged universal jar.'
    dependsOn tasks.named('universalJar')

    doLast {
        def jar = tasks.named('universalJar').get().archiveFile.get().asFile
        def required = [
                'fabric.mod.json',
                'META-INF/neoforge.mods.toml',
                'universal_click.mixins.json',
                'grasspow/universal_click/mixin/MinecraftMixin.class',
                'grasspow/universal_click/fabric/UniversalClickFabricClient.class',
                'grasspow/universal_click/neoforge/UniversalClickNeoForgeClient.class',
                'LICENSE_UniversalClick',
                'NOTICE_UniversalClick'
        ]
        def forbidden = [
                'pack.mcmeta',
                'META-INF/accesstransformer.cfg',
                'universal_click.accesswidener'
        ]

        new java.util.zip.ZipFile(jar).withCloseable { zip ->
            def names = zip.entries().collect { it.name }
            def duplicates = names.groupBy { it }.findAll { name, entries -> entries.size() > 1 }.keySet()
            if (!duplicates.isEmpty()) {
                throw new GradleException("Duplicate entries in ${jar.name}: ${duplicates}")
            }

            required.each { name ->
                if (names.count(name) != 1) {
                    throw new GradleException("Expected exactly one ${name} in ${jar.name}")
                }
            }

            forbidden.each { name ->
                if (names.contains(name)) {
                    throw new GradleException("Unexpected ${name} in ${jar.name}")
                }
            }
        }
    }
}

tasks.named('build') {
    dependsOn tasks.named('verifyUniversalJar')
}
